name: ClipKeyboard

options:
  bundleIdPrefix: com.mammer55
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Personal (free) Apple ID team for Mustafa Albaree. Automatic signing.
    DEVELOPMENT_TEAM: "34ZCK63GEC"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # ---- Container app (minimal SwiftUI shell) ----
  ClipKeyboard:
    type: application
    platform: iOS
    sources:
      - path: ClipKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mammer55.clipkeyboard
        INFOPLIST_FILE: ClipKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ClipKeyboardExtension
        embed: true
      - target: ClipWidgetExtension
        embed: true

  # ---- Custom keyboard extension ----
  ClipKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ClipKeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mammer55.clipkeyboard.clipkeyboardext
        INFOPLIST_FILE: ClipKeyboardExtension/Info.plist
        CFBundleDisplayName: Clip
        TARGETED_DEVICE_FAMILY: "1,2"

  # ---- Widget extension (hosts the Dynamic Island Live Activity) ----
  ClipWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ClipWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mammer55.clipkeyboard.widget
        INFOPLIST_FILE: ClipWidget/Info.plist
        CFBundleDisplayName: ClipWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        # Stubs out the app-only code in Shared/StopRecordingIntent.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG WIDGET_EXT
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  ClipKeyboard:
    build:
      targets:
        ClipKeyboard: all
        ClipKeyboardExtension: all
        ClipWidgetExtension: all
    run:
      config: Debug
