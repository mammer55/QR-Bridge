<style>
  :root {
    --accent: #8FE9CB; --accent2: #B4F3DD;
    --bg: #0F1A1C; --surface: #15252A; --border: #223639; --input: #2E474A;
    --text: #E3EFEB; --muted: #93AAA5; --dim: #5F7975; --codebg: #0C1517;
    --ok: #8FE9CB; --err: #FF9580; --on-accent: #0B1A16;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--sans);
    min-height: 100vh; overscroll-behavior: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; transition: background 0.2s, color 0.2s;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  .app { max-width: 1180px; margin: 0 auto; padding: 32px 32px 40px; min-height: 100vh; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 30px; height: 30px; color: var(--accent); flex-shrink: 0; }
  .word { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .build { font: 400 13px var(--mono); color: var(--dim); }
  .bar-actions { display: flex; align-items: center; gap: 8px; }
  .lock {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 13px;
    border-radius: 999px; border: 1px solid var(--input); background: transparent;
    color: var(--muted); font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .lock svg { width: 17px; height: 17px; }
  .lock[data-state="unlocked"] { border-color: transparent; color: var(--ok); background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .lock[data-state="locked"] .ic-open, .lock[data-state="unlocked"] .ic-shut { display: none; }
  .text-btn { height: 40px; padding: 0 14px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; }
  .text-btn:hover { color: var(--text); background: var(--surface); }

  .panes { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .pane {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; display: flex; flex-direction: column; min-height: 460px; min-width: 0;
  }
  .pane-head { display: flex; align-items: center; gap: 12px; min-height: 36px; margin-bottom: 16px; }
  .pane-head h2 { font-size: 20px; font-weight: 600; margin-right: auto; }
  textarea {
    flex: 1; width: 100%; min-height: 220px; resize: none; outline: none;
    border: 1px solid var(--border); border-radius: 12px; background: var(--codebg);
    color: var(--text); font: 400 18px/1.6 var(--mono); padding: 16px 18px;
  }
  textarea::placeholder { color: var(--dim); font: 400 18px var(--sans); }
  textarea:focus { border-color: var(--accent); }
  .well {
    flex: 1; min-height: 220px; max-height: max(220px, calc(100vh - 340px)); display: flex; overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: var(--codebg);
  }
  .empty { margin: auto; color: var(--dim); font-size: 16px; }
  .result-box {
    flex: 1; padding: 16px 18px; overflow-y: auto;
    font: 400 18px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
    unicode-bidi: plaintext; text-align: start;
  }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions .btn { flex: 1; }
  .btn {
    height: 52px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent;
    font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-default { background: transparent; color: var(--text); border-color: var(--input); }
  .btn-default:hover { border-color: var(--muted); }
  .msg { font-size: 14px; min-height: 20px; margin-top: 10px; color: var(--muted); }
  .msg.err { color: var(--err); }
  .msg.ok  { color: var(--ok); }
  .msg.dim { color: var(--dim); }

  .poll-row { display: flex; align-items: center; gap: 6px; }
  .poll-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); transition: background 0.3s; }
  .poll-dot.live, .poll-dot.pulse { background: var(--accent); }
  .poll-dot.pulse { animation: pulse 0.4s ease-out; }
  @keyframes pulse { 50% { transform: scale(1.8); } }
  .poll-label { font-size: 14px; color: var(--dim); }
  .auto-btn {
    height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--input);
    background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .auto-btn.active { border-color: transparent; color: var(--ok); background: color-mix(in srgb, var(--accent) 15%, transparent); }
  #pull-pane.arrived { animation: arrive 1.2s ease-out; }
  @keyframes arrive {
    0%   { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
    100% { border-color: var(--border); box-shadow: 0 0 0 3px transparent; }
  }

  .theme-overlay {
    position: fixed; inset: 0; z-index: 1000; padding: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(4, 10, 11, 0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .theme-panel {
    width: 100%; max-width: 420px; padding: 24px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
  }
  .theme-panel > .btn { width: 100%; }
  .theme-panel-title { display: flex; justify-content: space-between; align-items: center; font-size: 19px; font-weight: 600; margin-bottom: 16px; }
  .theme-close { cursor: pointer; color: var(--dim); padding: 4px; }
  .theme-close:hover { color: var(--text); }
  .theme-actions { display: flex; gap: 8px; }
  .theme-actions .btn { flex: 1; }
  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  .preset { height: 52px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; overflow: hidden; }
  .preset.active { border-color: var(--accent); }
  .preset-top { flex: 1; }
  .preset-bot { height: 10px; }
  .preset-label { font-size: 13px; text-align: center; margin-top: 5px; color: var(--muted); }
  .custom-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .custom-field { flex: 1; }
  .custom-field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .custom-field input[type=color] { width: 100%; height: 40px; border: 1px solid var(--input); border-radius: 8px; padding: 2px; background: var(--codebg); cursor: pointer; }
  .key-input {
    width: 100%; height: 52px; padding: 0 14px; margin-bottom: 14px; outline: none;
    border: 1px solid var(--input); border-radius: 12px; background: var(--codebg);
    color: var(--text); font: 400 18px var(--mono);
  }
  .key-input:focus { border-color: var(--accent); }
  .key-remember { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); margin-bottom: 16px; cursor: pointer; }
  .key-remember input { width: 19px; height: 19px; accent-color: var(--accent); }
  .pair-divider { border-top: 1px solid var(--border); margin: 16px 0 14px; }
  .pair-qr { background: #fff; padding: 10px; border-radius: 12px; width: 232px; margin: 14px auto 6px; }
  .pair-qr svg { display: block; width: 100%; height: auto; }

  @media (max-width: 640px) {
    .app { padding: 16px 14px 28px; }
    .bar { margin-bottom: 16px; }
    .word { font-size: 23px; }
    .panes { grid-template-columns: 1fr; gap: 14px; }
    .pane { min-height: 0; padding: 18px; }
    textarea, .well { min-height: 180px; }
    .result-box { max-height: 50vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pull-pane.arrived, .poll-dot.pulse { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="6.5" width="12" height="14.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <rect x="9" y="3" width="12" height="14.5" rx="3" fill="currentColor"/>
      </svg>
      <span class="word">Clip</span>
      <span class="build">v2.5.0</span>
    </div>
    <div class="bar-actions">
      <button class="lock" id="key-btn" data-state="locked" onclick="openKey()">
        <svg class="ic-shut" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="2" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <svg class="ic-open" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="2" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.8-1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span id="key-label">Locked</span>
      </button>
      <button class="text-btn" onclick="openTheme()" title="Ctrl+Shift+T">Theme</button>
    </div>
  </header>
  <div class="panes">
    <section class="pane">
      <div class="pane-head"><h2>Push</h2></div>
      <textarea id="push-text" placeholder="Paste or type" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div class="actions">
        <button class="btn btn-default" onclick="pasteClipboard()">Paste from clipboard</button>
        <button class="btn btn-primary" id="push-btn" onclick="pushClip()">Push</button>
      </div>
      <div id="push-msg" class="msg"></div>
    </section>
    <section class="pane" id="pull-pane">
      <div class="pane-head">
        <h2>Pull</h2>
        <div class="poll-row">
          <span class="poll-dot" id="poll-dot"></span>
          <span class="poll-label" id="poll-label">Connecting…</span>
        </div>
        <button id="auto-clip-btn" class="auto-btn" onclick="toggleAutoClip()">Auto copy</button>
      </div>
      <div class="well">
        <div id="pull-empty" class="empty">No clip yet.</div>
        <div id="pull-result" class="result-box hidden"></div>
      </div>
      <div class="actions">
        <button id="pull-copy-btn" class="btn btn-primary hidden" onclick="copyPulled()">Copy</button>
        <button id="pull-clear-btn" class="btn btn-default hidden" onclick="clearPull()">Clear</button>
        <button class="btn btn-default" id="fetch-btn" onclick="fetchLatest()">Fetch latest</button>
      </div>
      <div id="pull-msg" class="msg"></div>
    </section>
  </div>
</main>

<div class="theme-overlay hidden" id="theme-overlay" onclick="if(event.target===this)closeTheme()">
  <div class="theme-panel">
    <div class="theme-panel-title">
      <span>Theme</span>
      <span class="theme-close" onclick="closeTheme()">&#x2715;</span>
    </div>
    <div class="presets" id="preset-list"></div>
    <div class="custom-row">
      <div class="custom-field"><label>Accent</label><input type="color" id="pick-accent" oninput="previewCustom()"></div>
      <div class="custom-field"><label>Background</label><input type="color" id="pick-bg" oninput="previewCustom()"></div>
      <div class="custom-field"><label>Surface</label><input type="color" id="pick-surface" oninput="previewCustom()"></div>
    </div>
    <div class="theme-actions">
      <button class="btn btn-primary" onclick="saveTheme()">Save</button>
      <button class="btn btn-default" onclick="closeTheme()">Cancel</button>
    </div>
  </div>
</div>

<div class="theme-overlay hidden" id="key-overlay" onclick="if(event.target===this)closeKey()">
  <div class="theme-panel">
    <div class="theme-panel-title">
      <span>Passphrase</span>
      <span class="theme-close" onclick="closeKey()">&#x2715;</span>
    </div>
    <input type="password" id="key-input" class="key-input" placeholder="Passphrase"
           autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
           onkeydown="if(event.key==='Enter')saveKey()">
    <label class="key-remember"><input type="checkbox" id="key-remember"> Remember on this device</label>
    <div class="theme-actions">
      <button class="btn btn-primary" id="key-save" onclick="saveKey()">Unlock</button>
      <button class="btn btn-default" onclick="forgetKey()">Lock</button>
    </div>
    <div id="key-msg" class="msg"></div>
    <div class="pair-divider"></div>
    <button class="btn btn-default" id="pair-btn" onclick="startPair()">Pair with phone</button>
    <div id="pair-qr" class="pair-qr hidden"></div>
    <div id="pair-msg" class="msg"></div>
  </div>
</div>

<div class="theme-overlay hidden" id="send-overlay" onclick="if(event.target===this)closeSend()">
  <div class="theme-panel">
    <div class="theme-panel-title">
      <span>Pair</span>
      <span class="theme-close" onclick="closeSend()">&#x2715;</span>
    </div>
    <div class="msg dim" style="margin-bottom:14px">The computer showing the code gets this device's key.</div>
    <div class="theme-actions">
      <button class="btn btn-primary" id="send-btn" onclick="sendPair()">Send key</button>
      <button class="btn btn-default" onclick="closeSend()">Cancel</button>
    </div>
    <div id="send-msg" class="msg"></div>
  </div>
</div>

<script>
  const SUPA_URL  = 'https://owcukwsouruowulhohyq.supabase.co';
  const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Y3Vrd3NvdXJ1b3d1bGhvaHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5ODgzNzMsImV4cCI6MjA4NzU2NDM3M30.3njPBQGD1LEQc-h_j4VhAhngNzEH2p2gpqtRplqan_E';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);

  let pulledText = '';
  let lastSeenId = null;
  let realtimeConnected = false;
  let autoClipEnabled = localStorage.getItem('clip-auto') === '1';
  // Text we last wrote via auto-copy; if clipboard still matches, we "own" it
  let lastAutoCopied = null;

  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

  window.addEventListener('load', async () => {
    loadSavedTheme();
    updateAutoClipBtn();
    const stored = await cbLoadKey();
    if (stored instanceof Uint8Array) { clipRaw = stored; await setKey(stored); }
    else if (stored) { clipKey = stored; }   // remembered by 2.3.0, cannot be handed on
    updateKeyBtn();
    checkPairLink();
    // a code scanned while this page is already open only changes the hash
    window.addEventListener('hashchange', checkPairLink);
    startRealtime();
    startFallbackPoll();
  });

  // --- cb1 crypto: the same format as ClipBridge's shared/cbcrypt.py, which
  // documents it. Change one and change the other. test/cb1_compat.mjs pulls
  // this block out and checks it against the Python side. ---
  const CB_PREFIX = 'cb1.';
  const CB_SALT = new TextEncoder().encode('clipbridge/v1');
  const CB_ROUNDS = 600000;
  const CB_MAX_AGE_MS = 30 * 60 * 1000;
  const CB_MAX_AHEAD_MS = 10 * 60 * 1000;

  function cbNormalize(p) { return p.toLowerCase().split(/\s+/).filter(Boolean).join(' '); }

  async function cbDeriveRaw(passphrase) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(cbNormalize(passphrase)), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: CB_SALT, iterations: CB_ROUNDS }, base, 256));
  }

  function cbImportKey(raw) {
    return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }

  async function cbDeriveKey(passphrase) { return cbImportKey(await cbDeriveRaw(passphrase)); }

  function cbB64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function cbUnb64(text) {
    let t = text.replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    return Uint8Array.from(atob(t), c => c.charCodeAt(0));
  }

  async function cbEncrypt(key, text, source) {
    const enc = new TextEncoder();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const body = enc.encode(JSON.stringify({ v: 1, t: text, ts: Date.now() }));
    const sealed = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode(source || '') }, key, body);
    return CB_PREFIX + cbB64(iv) + '.' + cbB64(new Uint8Array(sealed));
  }

  // The clip's text, or null for anything that is not a fresh cb1 clip
  // sealed with this key for this source.
  async function cbDecrypt(key, content, source) {
    if (typeof content !== 'string' || !content.startsWith(CB_PREFIX)) return null;
    try {
      const [iv, sealed] = content.slice(CB_PREFIX.length).split('.');
      const body = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: cbUnb64(iv), additionalData: new TextEncoder().encode(source || '') },
        key, cbUnb64(sealed));
      const payload = JSON.parse(new TextDecoder().decode(body));
      const age = Date.now() - payload.ts;
      if (payload.v !== 1 || age > CB_MAX_AGE_MS || age < -CB_MAX_AHEAD_MS) return null;
      return payload.t;
    } catch (_) { return null; }
  }
  // --- end cb1 crypto ---

  // --- pair crypto: hands the clip key from a phone to a borrowed computer
  // without typing the passphrase there. The computer makes an ECDH P-256 key
  // pair whose private half never leaves the tab and shows only the public
  // half in the QR, so a photo of the code is worth nothing. The phone seals
  // the raw clip key under ECDH + HKDF and inserts it as a source 'pair' row:
  //   "cbp1." id "." phonePublicKey "." iv "." ciphertext
  // with "pair:" + id as associated data. test/pair.mjs exercises this block.
  const PAIR_PREFIX = 'cbp1.';
  const PAIR_LIFE_MS = 5 * 60 * 1000;

  async function pairNewSession() {
    const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    const pub = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
    return { id: cbB64(crypto.getRandomValues(new Uint8Array(9))), pub: cbB64(pub), privateKey: kp.privateKey };
  }

  async function pairSecret(privateKey, peerPub, id) {
    const enc = new TextEncoder();
    const peer = await crypto.subtle.importKey('raw', cbUnb64(peerPub), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: peer }, privateKey, 256);
    const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: enc.encode(id), info: enc.encode('clipbridge-pair/v1') },
      hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  // Phone side: the row content that hands clipRaw to the computer that
  // showed (id, computerPub).
  async function pairSeal(clipRaw, id, computerPub) {
    const enc = new TextEncoder();
    const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    const mine = cbB64(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)));
    const key = await pairSecret(kp.privateKey, computerPub, id);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const body = enc.encode(JSON.stringify({ v: 1, k: cbB64(clipRaw) }));
    const sealed = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: enc.encode('pair:' + id) }, key, body);
    return PAIR_PREFIX + id + '.' + mine + '.' + cbB64(iv) + '.' + cbB64(new Uint8Array(sealed));
  }

  // Computer side: the clip key's raw bytes from a pair row, or null.
  async function pairOpen(session, content) {
    if (typeof content !== 'string' || !content.startsWith(PAIR_PREFIX + session.id + '.')) return null;
    try {
      const [, , phonePub, iv, sealed] = content.split('.');
      const key = await pairSecret(session.privateKey, phonePub, session.id);
      const body = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: cbUnb64(iv), additionalData: new TextEncoder().encode('pair:' + session.id) },
        key, cbUnb64(sealed));
      const payload = JSON.parse(new TextDecoder().decode(body));
      const raw = cbUnb64(payload.k);
      return payload.v === 1 && raw.length === 32 ? raw : null;
    } catch (_) { return null; }
  }
  // --- end pair crypto ---

  // --- Passphrase ---
  // clipKey is a non extractable CryptoKey used for every clip. clipRaw is
  // the same key's bytes, held only where they may be handed on by pairing:
  // after the passphrase was typed here, or when remembered. Remembering
  // stores those bytes in IndexedDB, readable by any page on this github.io
  // origin; the passphrase itself is never stored. A computer unlocked by
  // pairing keeps no raw bytes unless remembered.

  // Every client encrypts now, so an unencrypted row is a forgery or the
  // iPhone's plaintext Shortcut, and neither belongs on this page.
  const ACCEPT_PLAINTEXT = false;
  let clipKey = null;
  let clipRaw = null;

  async function setKey(raw, remember) {
    clipKey = await cbImportKey(raw);
    if (remember !== undefined) await cbStoreKey(remember ? raw : null);
    updateKeyBtn();
  }

  // Fresh encrypted clips are the only thing that can tell a typo from the
  // right passphrase. Anyone can insert junk that looks encrypted, so this
  // passes when any recent clip opens, and saveKey lets a second press
  // through regardless: a flood of junk must never lock anyone out.
  async function keyOpensRecent(key) {
    const { data } = await sb.from('clips').select('content, source')
      .like('content', CB_PREFIX + '%')
      .gt('expires_at', new Date().toISOString())
      .order('created_at', { ascending: false }).limit(20);
    if (!data || !data.length) return true;
    for (const row of data) if (await cbDecrypt(key, row.content, row.source) !== null) return true;
    return false;
  }
  let rejectedPhrase = null;

  function cbDb() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open('clip', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('keys');
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  async function cbStoreKey(key) {
    const db = await cbDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('keys', 'readwrite');
      if (key) tx.objectStore('keys').put(key, 'clip'); else tx.objectStore('keys').delete('clip');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  async function cbLoadKey() {
    try {
      const db = await cbDb();
      return await new Promise(resolve => {
        const r = db.transaction('keys').objectStore('keys').get('clip');
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      });
    } catch (_) { return null; }
  }

  function updateKeyBtn() {
    document.getElementById('key-btn').dataset.state = clipKey ? 'unlocked' : 'locked';
    document.getElementById('key-label').textContent = clipKey ? 'Unlocked' : 'Locked';
  }

  function openKey() {
    document.getElementById('key-overlay').classList.remove('hidden');
    document.getElementById('key-input').value = '';
    setMsg('key-msg', clipKey ? 'Unlocked on this device.' : '', 'dim');
    document.getElementById('key-input').focus();
  }

  function closeKey() {
    stopPair();
    document.getElementById('pair-btn').textContent = 'Pair with phone';
    document.getElementById('key-overlay').classList.add('hidden');
  }

  // --- Pairing, computer side ---

  let pairSession = null;
  let pairTimer = null;

  function stopPair() {
    if (pairTimer) clearInterval(pairTimer);
    pairTimer = null;
    pairSession = null;
    document.getElementById('pair-qr').classList.add('hidden');
    setMsg('pair-msg', '', '');
  }

  async function startPair() {
    stopPair();
    const session = await pairNewSession();
    pairSession = session;
    const url = location.origin + location.pathname + '#pair=' + session.id + '.' + session.pub;
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    const box = document.getElementById('pair-qr');
    box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
    box.classList.remove('hidden');
    document.getElementById('pair-btn').textContent = 'New code';
    setMsg('pair-msg', 'Scan with your phone.', 'dim');
    const started = Date.now();
    pairTimer = setInterval(async () => {
      if (pairSession !== session) return;
      if (Date.now() - started > PAIR_LIFE_MS) {
        stopPair();
        setMsg('pair-msg', 'Code expired.', 'dim');
        return;
      }
      try {
        const { data } = await sb.from('clips').select('content')
          .eq('source', 'pair').like('content', PAIR_PREFIX + session.id + '.%').limit(5);
        for (const row of data || []) {
          const raw = await pairOpen(session, row.content);
          if (raw && pairSession === session) {
            const remember = document.getElementById('key-remember').checked;
            if (remember) clipRaw = raw;
            await setKey(raw, remember);
            closeKey();
            fetchLatest();
            return;
          }
        }
      } catch (_) {}
    }, 2000);
  }

  // --- Pairing, phone side ---

  let pendingPair = null;

  // A scanned code opens this page with #pair=id.publicKey. The fragment
  // never reaches a server; it is cleared at once so a reload cannot resend.
  function checkPairLink() {
    const m = location.hash.match(/^#pair=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
    if (!m) return;
    history.replaceState(null, '', location.pathname);
    pendingPair = { id: m[1], pub: m[2] };
    if (clipRaw) {
      openSend();
    } else {
      openKey();
      setMsg('key-msg', 'Unlock to send the key to the computer showing the code.', 'dim');
    }
  }

  function openSend() {
    setMsg('send-msg', '', '');
    document.getElementById('send-btn').disabled = false;
    document.getElementById('send-overlay').classList.remove('hidden');
  }

  function closeSend() {
    pendingPair = null;
    document.getElementById('send-overlay').classList.add('hidden');
  }

  async function sendPair() {
    if (!pendingPair || !clipRaw) return;
    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    try {
      const content = await pairSeal(clipRaw, pendingPair.id, pendingPair.pub);
      const expiresAt = new Date(Date.now() + 15 * 60 * 1000).toISOString();
      const { error } = await sb.from('clips').insert({ content, expires_at: expiresAt, source: 'pair' });
      if (error) throw error;
      pendingPair = null;
      setMsg('send-msg', 'Key sent.', 'ok');
      setTimeout(closeSend, 1500);
    } catch (e) {
      setMsg('send-msg', e.message || 'Error.', 'err');
      btn.disabled = false;
    }
  }

  async function saveKey() {
    const phrase = document.getElementById('key-input').value;
    if (!cbNormalize(phrase)) return;
    const btn = document.getElementById('key-save');
    btn.disabled = true; btn.textContent = 'Unlocking…';
    try {
      const raw = await cbDeriveRaw(phrase);
      if (rejectedPhrase !== cbNormalize(phrase) && !await keyOpensRecent(await cbImportKey(raw))) {
        rejectedPhrase = cbNormalize(phrase);
        setMsg('key-msg', 'That passphrase opens none of the recent clips. Unlock again to use it anyway.', 'err');
      } else {
        rejectedPhrase = null;
        clipRaw = raw;
        await setKey(raw, document.getElementById('key-remember').checked);
        closeKey();
        if (pendingPair) openSend();
        fetchLatest();
      }
    } catch (e) { setMsg('key-msg', e.message || 'Error.', 'err'); }
    document.getElementById('key-input').value = '';
    btn.disabled = false; btn.textContent = 'Unlock';
  }

  async function forgetKey() {
    clipKey = null;
    clipRaw = null;
    await cbStoreKey(null);
    updateKeyBtn();
    clearPull();
    closeKey();
  }

  // Turns a row into what the pull side shows: { text }, { locked } when an
  // encrypted clip waits for the passphrase, or null for a row to ignore
  // (a forgery, a replay, a clip under some other passphrase).
  async function openRow(row) {
    if (!row || !row.content || row.source === 'pair') return null;
    if (!row.content.startsWith(CB_PREFIX)) return ACCEPT_PLAINTEXT ? { text: row.content } : null;
    if (!clipKey) return { locked: true };
    const text = await cbDecrypt(clipKey, row.content, row.source);
    return text === null ? null : { text };
  }

  async function takeRow(row) {
    const opened = await openRow(row);
    if (!opened) return false;
    if (opened.locked) {
      setMsg('pull-msg', 'Encrypted clip waiting. Unlock to read it.', 'dim');
      return true;
    }
    pulledText = opened.text;
    showPullResult(pulledText);
    setMsg('pull-msg', '', '');
    tryAutoCopy(pulledText);
    return true;
  }

  function toggleAutoClip() {
    autoClipEnabled = !autoClipEnabled;
    localStorage.setItem('clip-auto', autoClipEnabled ? '1' : '0');
    updateAutoClipBtn();
  }

  function updateAutoClipBtn() {
    const btn = document.getElementById('auto-clip-btn');
    btn.classList.toggle('active', autoClipEnabled);
    btn.title = autoClipEnabled ? 'New clips go to the clipboard' : 'New clips stay on the page';
  }

  async function tryAutoCopy(text) {
    if (!autoClipEnabled) return;
    try {
      const current = await navigator.clipboard.readText();
      // Only write if we still own the clipboard (or it's our first auto-copy)
      if (lastAutoCopied === null || current === lastAutoCopied) {
        await navigator.clipboard.writeText(text);
        lastAutoCopied = text;
      }
      // User copied something else externally — back off; next new clip will try again
    } catch(_) {}
  }

  // --- Realtime (primary delivery) ---

  function startRealtime() {
    sb.channel('clips-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'clips' }, payload => {
        const row = payload.new;
        if (row && row.id !== lastSeenId && new Date(row.expires_at) > new Date()) {
          lastSeenId = row.id;
          takeRow(row).then(shown => { if (shown) flashDot(); });
        }
      })
      .subscribe(status => {
        realtimeConnected = status === 'SUBSCRIBED';
        const dot = document.getElementById('poll-dot');
        const lbl = document.getElementById('poll-label');
        if (realtimeConnected) {
          dot.className = 'poll-dot live';
          lbl.textContent = 'Live';
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          dot.className = 'poll-dot';
          lbl.textContent = 'Reconnecting…';
        }
      });
  }

  // Fallback poll catches gaps when realtime misses an event (e.g. tab was backgrounded)
  function startFallbackPoll() { setInterval(fallbackPoll, 15000); }

  async function fallbackPoll() {
    try {
      const { data } = await sb.from('clips')
        .select('id, content, source')
        .or('source.is.null,source.neq.pair')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1).single();
      if (data && data.id !== lastSeenId) {
        lastSeenId = data.id;
        if (await takeRow(data)) flashDot();
      }
    } catch(_) {}
    if (!realtimeConnected) {
      const dot = document.getElementById('poll-dot');
      if (!dot.className.includes('pulse')) dot.className = 'poll-dot live';
    }
  }

  function flashDot() {
    const dot = document.getElementById('poll-dot');
    dot.className = 'poll-dot pulse';
    setTimeout(() => { dot.className = 'poll-dot live'; }, 500);
  }

  // --- Push ---

  async function pushClip() {
    const text = document.getElementById('push-text').value.trim();
    const btn  = document.getElementById('push-btn');
    if (!text) { setMsg('push-msg', 'Nothing to push.', 'err'); return; }
    if (!clipKey) { setMsg('push-msg', 'Locked. Unlock to push.', 'err'); openKey(); return; }
    btn.disabled = true; btn.textContent = 'Pushing…';
    const expiresAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
    try {
      const content = await cbEncrypt(clipKey, text, 'pc-to-mac');
      const { error } = await sb.from('clips').insert({ content, expires_at: expiresAt, source: 'pc-to-mac' });
      if (error) throw error;
      setMsg('push-msg', 'Pushed.', 'ok');
      document.getElementById('push-text').value = '';
      setTimeout(() => setMsg('push-msg', '', ''), 3000);
    } catch(e) { setMsg('push-msg', e.message || 'Error.', 'err'); }
    btn.disabled = false; btn.textContent = 'Push';
  }

  async function pasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('push-text').value = text;
    } catch(_) {
      setMsg('push-msg', 'Clipboard access is blocked. Paste with ⌘V or Ctrl+V.', 'dim');
      document.getElementById('push-text').focus();
    }
  }

  // --- Pull ---

  async function fetchLatest() {
    const btn = document.getElementById('fetch-btn');
    btn.disabled = true; btn.textContent = 'Fetching…';
    try {
      const { data, error } = await sb.from('clips')
        .select('id, content, source')
        .or('source.is.null,source.neq.pair')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1).single();
      if (error || !data) {
        setMsg('pull-msg', 'Nothing waiting.', 'dim');
      } else {
        lastSeenId = data.id;
        if (!await takeRow(data)) setMsg('pull-msg', 'Nothing waiting.', 'dim');
      }
    } catch(_) { setMsg('pull-msg', 'Network error.', 'err'); }
    btn.disabled = false; btn.textContent = 'Fetch latest';
  }

  function showPullResult(text) {
    const pane = document.getElementById('pull-pane');
    pane.classList.remove('arrived');
    void pane.offsetWidth;   // restart the arrival glow
    pane.classList.add('arrived');
    document.getElementById('pull-empty').classList.add('hidden');
    document.getElementById('pull-result').textContent = text;
    document.getElementById('pull-result').classList.remove('hidden');
    document.getElementById('pull-copy-btn').classList.remove('hidden');
    document.getElementById('pull-clear-btn').classList.remove('hidden');
  }

  async function copyPulled() {
    try {
      await navigator.clipboard.writeText(pulledText);
    } catch(_) {}
    const btn = document.getElementById('pull-copy-btn');
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  }

  function clearPull() {
    pulledText = '';
    document.getElementById('pull-result').classList.add('hidden');
    document.getElementById('pull-empty').classList.remove('hidden');
    document.getElementById('pull-copy-btn').classList.add('hidden');
    document.getElementById('pull-clear-btn').classList.add('hidden');
    setMsg('pull-msg', '', '');
  }

  // --- Theme ---

  const PRESETS = [
    { name:'Night', accent:'#8FE9CB', accent2:'#B4F3DD', bg:'#0F1A1C', surface:'#15252A', border:'#223639', input:'#2E474A', text:'#E3EFEB', muted:'#93AAA5', dim:'#5F7975', codebg:'#0C1517' },
    { name:'Ink',   accent:'#C9CED6', accent2:'#E2E5EA', bg:'#131416', surface:'#1B1D20', border:'#2A2D31', input:'#3A3E43', text:'#E6E7E9', muted:'#9A9EA4', dim:'#62666C', codebg:'#0F1012' },
    { name:'Day',   accent:'#9FE8CF', accent2:'#86DDBF', bg:'#F2F4F2', surface:'#FFFFFF', border:'#E0E4E1', input:'#C9CFCB', text:'#1F2D29', muted:'#5B6965', dim:'#98A39F', codebg:'#F6F8F7' },
    { name:'Sky',   accent:'#bde0ff', accent2:'#9dcfff', bg:'#eef4fb', surface:'#ffffff', border:'#ccd9e8', input:'#b0c4d8', text:'#1a3a5c', muted:'#4a6a8c', dim:'#8aaccb', codebg:'#e8f0f8' },
    { name:'Peach', accent:'#ffd4b0', accent2:'#ffbf8e', bg:'#fdf5ef', surface:'#ffffff', border:'#e8d5c8', input:'#d4b8a8', text:'#3d2b1f', muted:'#7a5a4a', dim:'#b89080', codebg:'#f5ede6' },
  ];
  // v2 keys: everyone starts on Night once, whatever 2.4 and earlier saved.
  const THEME_KEY = 'clip-theme-v2', THEME_NAME_KEY = 'clip-theme-name-v2';

  function applyTheme(t) {
    const r = document.documentElement.style;
    ['accent','accent2','bg','surface','border','input','text','muted','dim'].forEach(k => r.setProperty('--'+k, t[k]));
    r.setProperty('--codebg', t.codebg);
    const light = getLuminance(t.bg) > 0.35;
    r.setProperty('color-scheme', light ? 'light' : 'dark');
    r.setProperty('--ok',  light ? '#0F7B5A' : t.accent);
    r.setProperty('--err', light ? '#C2410C' : '#FF9580');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t.bg);
  }

  function loadSavedTheme() {
    try { const s = localStorage.getItem(THEME_KEY); if (s) applyTheme(JSON.parse(s)); } catch(_) {}
  }

  let pendingTheme = null;
  let themeAtOpen  = null;

  function buildPresets() {
    const active = localStorage.getItem(THEME_NAME_KEY) || 'Night';
    document.getElementById('preset-list').innerHTML = PRESETS.map(p => {
      const cls = p.name === active ? 'preset active' : 'preset';
      return `<div><div class="${cls}" onclick="selectPreset('${p.name}')" style="background:${p.bg}">` +
        `<div class="preset-top" style="background:${p.surface};border-bottom:2px solid ${p.border}"></div>` +
        `<div class="preset-bot" style="background:${p.accent}"></div>` +
        `</div><div class="preset-label">${p.name}</div></div>`;
    }).join('');
  }

  function selectPreset(name) {
    const t = PRESETS.find(p => p.name === name);
    if (!t) return;
    pendingTheme = { ...t, _name: name };
    applyTheme(t);
    document.getElementById('pick-accent').value  = t.accent;
    document.getElementById('pick-bg').value      = t.bg;
    document.getElementById('pick-surface').value = t.surface;
    document.querySelectorAll('.preset').forEach((el, i) => el.classList.toggle('active', PRESETS[i].name === name));
  }

  function getLuminance(hex) {
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const lin = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
    return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  }

  function darken(hex, amt) {
    const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
    const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
    const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  function previewCustom() {
    const accent  = document.getElementById('pick-accent').value;
    const bg      = document.getElementById('pick-bg').value;
    const surface = document.getElementById('pick-surface').value;
    const lum = getLuminance(bg);
    pendingTheme = {
      ...(pendingTheme || PRESETS[0]),
      accent, accent2: darken(accent, 20), bg, surface, codebg: bg,
      text:   lum > 0.35 ? '#1a1a1a' : '#e8e8e8',
      muted:  lum > 0.35 ? '#605e5c' : '#9a9a9a',
      dim:    lum > 0.35 ? '#a19f9d' : '#606060',
      border: lum > 0.35 ? '#e1dfdd' : '#3d3d3d',
      input:  lum > 0.35 ? '#c8c6c4' : '#555555',
      _name: 'Custom',
    };
    applyTheme(pendingTheme);
    document.querySelectorAll('.preset').forEach(el => el.classList.remove('active'));
  }

  function openTheme() {
    buildPresets();
    const saved = JSON.parse(localStorage.getItem(THEME_KEY) || JSON.stringify(PRESETS[0]));
    themeAtOpen  = saved;
    pendingTheme = null;
    document.getElementById('pick-accent').value  = saved.accent  || PRESETS[0].accent;
    document.getElementById('pick-bg').value      = saved.bg      || PRESETS[0].bg;
    document.getElementById('pick-surface').value = saved.surface || PRESETS[0].surface;
    document.getElementById('theme-overlay').classList.remove('hidden');
  }

  function closeTheme() {
    document.getElementById('theme-overlay').classList.add('hidden');
    if (themeAtOpen) applyTheme(themeAtOpen);
  }

  function saveTheme() {
    if (!pendingTheme) { closeTheme(); return; }
    const { _name, ...td } = pendingTheme;
    localStorage.setItem(THEME_KEY, JSON.stringify(td));
    localStorage.setItem(THEME_NAME_KEY, _name || 'Custom');
    themeAtOpen = td;
    document.getElementById('theme-overlay').classList.add('hidden');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeKey(); closeSend(); }
    if (e.ctrlKey && e.shiftKey && e.key === 'T') { e.preventDefault(); openTheme(); }
    if (e.key === 'Escape') closeTheme();
  });

  function setMsg(id, text, cls) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg' + (cls ? ' ' + cls : '');
  }
</script>
</body>
</html>
