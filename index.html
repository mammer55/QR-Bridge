<style>
  :root {
    --accent:  #c2f6e5;
    --accent2: #a8e8d0;
    --bg:      #f3f2f1;
    --surface: #ffffff;
    --border:  #e1dfdd;
    --input:   #c8c6c4;
    --text:    #323130;
    --muted:   #605e5c;
    --dim:     #a19f9d;
    --err:     #d83b01;
    --code-bg: #f3f2f1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    transition: background 0.2s, color 0.2s;
    overflow-x: hidden;
    width: 100%;
  }
  .container { width: 100%; max-width: 860px; overflow-x: hidden; }

  /* HEADER */
  .header {
    background: var(--accent);
    border-radius: 4px 4px 0 0;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    margin-bottom: 0;
  }
  .header-title { color: #1a1a1a; font-size: 13px; font-weight: 600; flex: 1; }
  .theme-hint { font-size: 10px; color: rgba(0,0,0,0.4); cursor: pointer; user-select: none; padding: 2px 6px; border-radius: 2px; }
  .theme-hint:hover { background: rgba(0,0,0,0.08); }

  /* COLUMNS */
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 12px;
    align-items: stretch;
  }
  .cols > div { display: flex; flex-direction: column; }
  .cols > div .card { flex: 1; min-height: 100%; }
  @media (max-width: 600px) {
    body { padding: 12px 8px 32px; }
    .container { width: 100vw; padding: 0 8px; max-width: 100vw; }
    .cols { grid-template-columns: 1fr; grid-auto-rows: auto; }
    .cols > div { height: auto; }
    .cols > div .card { flex: none; }
    .card { padding: 12px; }
    .send-row { flex-direction: column; }
    .send-row textarea { min-height: 80px; margin-bottom: 6px; }
    .paste-btn { width: 100%; text-align: center; padding: 8px; }
    .header { border-radius: 4px; }
    .container { overflow: hidden; }
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .card:last-child { border-radius: 0 0 4px 4px; margin-bottom: 12px; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  /* TEXTAREA */
  textarea {
    width: 100%;
    flex: 1;
    min-height: 90px;
    height: 100%;
    border: 1px solid var(--input);
    border-radius: 2px;
    padding: 7px 9px;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    resize: none;
    outline: none;
    margin-bottom: 0;
    line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  textarea::placeholder { color: var(--dim); font-size: 14px; }

  .send-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: stretch; flex: 1; }
  .send-row textarea { margin-bottom: 0; }
  .paste-btn {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--input);
    border-radius: 2px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-start;
  }
  .paste-btn:hover { background: var(--border); }

  /* BUTTONS */
  .btn {
    display: inline-block;
    padding: 6px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 2px;
    cursor: pointer;
    border: none;
    transition: background 0.1s;
  }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { background: var(--input); cursor: not-allowed; }
  .btn-default { background: var(--surface); color: var(--text); border: 1px solid var(--input); }
  .btn-default:hover { background: var(--bg); }
  .btn-block { width: 100%; text-align: center; display: block; }

  /* QR */
  .qr-center { display: flex; justify-content: center; padding: 12px 0 8px; }
  .qr-center canvas, .qr-center img { border: 1px solid var(--border); }

  .code-display {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: var(--text);
    padding: 10px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 8px;
    text-indent: 0.28em;
  }
  .timer { font-size: 11px; color: var(--dim); text-align: center; margin-bottom: 10px; }
  .timer.warn { color: var(--err); }

  /* RECEIVE */
  .code-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .code-input {
    flex: 1;
    border: 1px solid var(--input);
    border-radius: 2px;
    padding: 6px 9px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-align: center;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface);
    outline: none;
  }
  .code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .code-input::placeholder { font-size: 12px; font-weight: 400; letter-spacing: 0.06em; color: var(--dim); }

  .result-box {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 9px;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: normal;
    max-height: 160px;
    overflow-y: auto;
    margin-bottom: 8px;
    line-height: 1.5;
    color: var(--text);
  }

  .msg { font-size: 11px; min-height: 18px; margin-top: 4px; }
  .msg.err { color: var(--err); }
  .msg.ok  { color: #107c10; }
  .msg.dim { color: var(--dim); }
  .hidden { display: none !important; }

  /* ── THEME PANEL ── */
  .theme-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .theme-panel-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .theme-close { cursor: pointer; font-size: 16px; color: var(--dim); line-height: 1; }
  .theme-close:hover { color: var(--text); }

  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
  .preset {
    border-radius: 4px;
    height: 42px;
    cursor: pointer;
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.1s, border-color 0.1s;
  }
  .preset:hover { transform: scale(1.06); }
  .preset.active { border-color: var(--text); }
  .preset-top { flex: 1; }
  .preset-bot { height: 12px; }
  .preset-label { font-size: 9px; text-align: center; margin-top: 4px; color: var(--muted); letter-spacing: 0.05em; }

  .custom-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .custom-field { flex: 1; }
  .custom-field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .custom-field input[type=color] {
    width: 100%; height: 32px; border: 1px solid var(--input); border-radius: 2px; cursor: pointer; padding: 2px; background: var(--surface);
  }

  .theme-actions { display: flex; gap: 8px; }
  .theme-actions .btn { flex: 1; font-size: 12px; padding: 7px; text-align: center; }
</style>
</head>
<body>
<div class="container">

  <!-- Retrieved view (phone opened a ?code= link) -->
  <div id="retrieved-card" class="card hidden" style="border-top:1px solid var(--border);border-radius:4px;margin-bottom:12px;">
    <div class="section-label">Retrieved</div>
    <div id="retrieved-text" class="result-box">Loading...</div>
    <button class="btn btn-primary btn-block" onclick="copyRetrieved()">Copy</button>
    <div id="retrieved-msg" class="msg"></div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-title">QR Bridge</div>
    <span class="theme-hint" onclick="openTheme()" title="Ctrl+Shift+T">⬤ Theme</span>
  </div>

  <div class="cols">
    <!-- Left: Send / QR -->
    <div>
      <div id="send-card" class="card">
        <div class="section-label" id="send-label">Send to Phone</div>
        <div class="send-row">
          <textarea id="send-text" placeholder="Paste here (Ctrl+V)"></textarea>
          <button class="paste-btn" onclick="pasteClipboard()">Paste</button>
        </div>
        <button class="btn btn-primary" id="send-btn" onclick="sendClip()">Generate QR</button>
        <div id="send-msg" class="msg"></div>
      </div>
      <div id="qr-card" class="card hidden">
        <div class="section-label">Scan with iPhone Camera</div>
        <div class="qr-center" id="qr-wrap"></div>
        <div class="code-display" id="code-big"></div>
        <div class="timer" id="timer"></div>
        <button class="btn btn-default btn-block" onclick="resetSend()">Clear</button>
      </div>
    </div>

    <!-- Right: Receive -->
    <div>
      <div id="receive-card" class="card">
        <div class="section-label">Receive from Phone</div>
        <button class="btn btn-primary btn-block" onclick="fetchClip()" id="fetch-btn">Fetch Latest</button>
        <div id="fetch-result" class="result-box hidden" style="margin-top:10px"></div>
        <button id="copy-fetched-btn" class="btn btn-primary btn-block hidden" onclick="copyFetched()" style="margin-bottom:6px;margin-top:4px">Copy</button>
        <div id="fetch-msg" class="msg"></div>
      </div>
    </div>
  </div>

</div>

<!-- ── THEME PANEL ── -->
<div class="theme-overlay hidden" id="theme-overlay" onclick="if(event.target===this)closeTheme()">
  <div class="theme-panel">
    <div class="theme-panel-title">
      <span>Theme</span>
      <span class="theme-close" onclick="closeTheme()">✕</span>
    </div>

    <div class="presets" id="preset-list"></div>

    <div class="custom-row">
      <div class="custom-field">
        <label>Accent</label>
        <input type="color" id="pick-accent" oninput="previewCustom()">
      </div>
      <div class="custom-field">
        <label>Background</label>
        <input type="color" id="pick-bg" oninput="previewCustom()">
      </div>
      <div class="custom-field">
        <label>Surface</label>
        <input type="color" id="pick-surface" oninput="previewCustom()">
      </div>
    </div>

    <div class="theme-actions">
      <button class="btn btn-primary" onclick="saveTheme()">Save</button>
      <button class="btn btn-default" onclick="closeTheme()">Cancel</button>
    </div>
  </div>
</div>

<script>
  /* ── SUPABASE ── */
  const SUPA_URL  = 'https://owcukwsouruowulhohyq.supabase.co';
  const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Y3Vrd3NvdXJ1b3d1bGhvaHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5ODgzNzMsImV4cCI6MjA4NzU2NDM3M30.3njPBQGD1LEQc-h_j4VhAhngNzEH2p2gpqtRplqan_E';
  const BASE_URL  = 'https://mammer55.github.io/QR-Bridge/';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);
  let countdown = null, fetchedText = '';

  /* ── THEMES ── */
  const PRESETS = [
    { name: 'Mint',    accent:'#c2f6e5', accent2:'#a8e8d0', bg:'#f3f2f1', surface:'#ffffff', border:'#e1dfdd', input:'#c8c6c4', text:'#323130', muted:'#605e5c', dim:'#a19f9d', codebg:'#f3f2f1' },
    { name: 'Dark',    accent:'#c2f6e5', accent2:'#a8e8d0', bg:'#1e1e1e', surface:'#2d2d2d', border:'#3d3d3d', input:'#555',    text:'#d4d4d4', muted:'#999',    dim:'#666',    codebg:'#252525' },
    { name: 'Sky',     accent:'#bde0ff', accent2:'#9dcfff', bg:'#eef4fb', surface:'#ffffff', border:'#ccd9e8', input:'#b0c4d8', text:'#1a3a5c', muted:'#4a6a8c', dim:'#8aaccb', codebg:'#e8f0f8' },
    { name: 'Peach',   accent:'#ffd4b0', accent2:'#ffbf8e', bg:'#fdf5ef', surface:'#ffffff', border:'#e8d5c8', input:'#d4b8a8', text:'#3d2b1f', muted:'#7a5a4a', dim:'#b89080', codebg:'#f5ede6' },
    { name: 'Mono',    accent:'#d0d0d0', accent2:'#b8b8b8', bg:'#f8f8f8', surface:'#ffffff', border:'#e0e0e0', input:'#c8c8c8', text:'#1a1a1a', muted:'#606060', dim:'#a0a0a0', codebg:'#f0f0f0' },
  ];

  function applyTheme(t) {
    const r = document.documentElement.style;
    r.setProperty('--accent',  t.accent);
    r.setProperty('--accent2', t.accent2);
    r.setProperty('--bg',      t.bg);
    r.setProperty('--surface', t.surface);
    r.setProperty('--border',  t.border);
    r.setProperty('--input',   t.input);
    r.setProperty('--text',    t.text);
    r.setProperty('--muted',   t.muted);
    r.setProperty('--dim',     t.dim);
    r.setProperty('--code-bg', t.codebg);
  }

  function loadSavedTheme() {
    try {
      const saved = localStorage.getItem('qrbridge-theme');
      if (saved) applyTheme(JSON.parse(saved));
    } catch(e) {}
  }

  function getSavedThemeName() {
    try {
      const saved = localStorage.getItem('qrbridge-theme-name');
      return saved || 'Mint';
    } catch(e) { return 'Mint'; }
  }

  /* ── THEME PANEL ── */
  function buildPresets() {
    const list = document.getElementById('preset-list');
    const active = getSavedThemeName();
    list.innerHTML = PRESETS.map(p => `
      <div>
        <div class="preset ${p.name===active?'active':''}" onclick="selectPreset('${p.name}')"
          style="background:${p.bg}">
          <div class="preset-top" style="background:${p.surface}; border-bottom:2px solid ${p.border}"></div>
          <div class="preset-bot" style="background:${p.accent}"></div>
        </div>
        <div class="preset-label">${p.name}</div>
      </div>
    `).join('');
  }

  let pendingTheme = null;

  function selectPreset(name) {
    const t = PRESETS.find(p => p.name === name);
    if (!t) return;
    pendingTheme = { ...t, _name: name };
    applyTheme(t);
    document.getElementById('pick-accent').value  = t.accent;
    document.getElementById('pick-bg').value      = t.bg;
    document.getElementById('pick-surface').value = t.surface;
    document.querySelectorAll('.preset').forEach((el,i) => {
      el.classList.toggle('active', PRESETS[i].name === name);
    });
  }

  function getLuminance(hex) {
    const r = parseInt(hex.slice(1,3),16)/255;
    const g = parseInt(hex.slice(3,5),16)/255;
    const b = parseInt(hex.slice(5,7),16)/255;
    const l = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
    return 0.2126*l(r) + 0.7152*l(g) + 0.0722*l(b);
  }

  function autoText(bgHex) {
    const lum = getLuminance(bgHex);
    return {
      text:  lum > 0.35 ? '#1a1a1a' : '#e8e8e8',
      muted: lum > 0.35 ? '#605e5c' : '#9a9a9a',
      dim:   lum > 0.35 ? '#a19f9d' : '#606060',
    };
  }

  function previewCustom() {
    const accent  = document.getElementById('pick-accent').value;
    const bg      = document.getElementById('pick-bg').value;
    const surface = document.getElementById('pick-surface').value;
    const t = autoText(bg);
    pendingTheme = {
      ...( pendingTheme || PRESETS[0] ),
      accent, accent2: accent, bg, surface,
      codebg: bg,
      text:  t.text,
      muted: t.muted,
      dim:   t.dim,
      border: getLuminance(bg) > 0.35 ? '#e1dfdd' : '#3d3d3d',
      input:  getLuminance(bg) > 0.35 ? '#c8c6c4' : '#555555',
      _name: 'Custom'
    };
    applyTheme(pendingTheme);
    document.querySelectorAll('.preset').forEach(el => el.classList.remove('active'));
  }

  function openTheme() {
    buildPresets();
    const saved = JSON.parse(localStorage.getItem('qrbridge-theme') || JSON.stringify(PRESETS[0]));
    document.getElementById('pick-accent').value  = saved.accent  || PRESETS[0].accent;
    document.getElementById('pick-bg').value      = saved.bg      || PRESETS[0].bg;
    document.getElementById('pick-surface').value = saved.surface || PRESETS[0].surface;
    pendingTheme = null;
    document.getElementById('theme-overlay').classList.remove('hidden');
  }

  function closeTheme() {
    document.getElementById('theme-overlay').classList.add('hidden');
    loadSavedTheme(); // revert any preview
  }

  function saveTheme() {
    if (!pendingTheme) { closeTheme(); return; }
    const { _name, ...themeData } = pendingTheme;
    localStorage.setItem('qrbridge-theme', JSON.stringify(themeData));
    localStorage.setItem('qrbridge-theme-name', _name || 'Custom');
    document.getElementById('theme-overlay').classList.add('hidden');
  }

  /* ── KEYBOARD SHORTCUT ── */
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key === 'T') { e.preventDefault(); openTheme(); }
    if (e.key === 'Escape') closeTheme();
  });

  /* ── INIT ── */
  window.addEventListener('load', () => {
    loadSavedTheme();
    initSendLabel();
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      document.getElementById('send-card').classList.add('hidden');
      document.getElementById('qr-card').classList.add('hidden');
      document.getElementById('receive-card').classList.add('hidden');
      document.querySelector('.header').classList.add('hidden');
      document.querySelector('.cols').classList.add('hidden');
      document.getElementById('retrieved-card').classList.remove('hidden');
      loadRetrieved(code.toLowerCase());
    }
  });

  /* ── RETRIEVED ── */
  async function loadRetrieved(code) {
    try {
      const { data, error } = await sb.from('clips').select('content').eq('id', code).single();
      const el = document.getElementById('retrieved-text');
      if (error || !data) {
        el.textContent = 'Not found or expired.';
        document.getElementById('retrieved-msg').textContent = 'Codes expire 90 seconds after creation.';
        document.getElementById('retrieved-msg').className = 'msg err';
      } else {
        el.textContent = data.content;
      }
    } catch(e) { document.getElementById('retrieved-text').textContent = 'Network error.'; }
  }

  async function copyRetrieved() {
    await navigator.clipboard.writeText(document.getElementById('retrieved-text').textContent).catch(()=>{});
    const btn = document.querySelector('#retrieved-card .btn');
    btn.textContent = 'Copied'; setTimeout(()=>btn.textContent='Copy', 2000);
  }

  /* ── SEND ── */
  const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);

  function initSendLabel() {
    if (isMobile) {
      document.getElementById('send-label').textContent = 'Send to Computer';
      document.getElementById('send-btn').textContent = 'Send';
    }
  }

  async function sendClip() {
    const text = document.getElementById('send-text').value.trim();
    const btn = document.getElementById('send-btn');
    if (!text) { setMsg('send-msg','Nothing to send.','err'); return; }
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      const { data, error } = await sb.from('clips').insert({ content: text }).select('id').single();
      if (error) throw error;
      if (isMobile) {
        // Phone -> Computer: no QR needed, just confirm
        setMsg('send-msg', 'Sent. Fetch on your computer.', 'ok');
        document.getElementById('send-text').value = '';
        btn.disabled = false; btn.textContent = 'Send';
      } else {
        showQR(data.id);
      }
    } catch(e) {
      setMsg('send-msg', e.message||'Error.','err');
      btn.disabled = false;
      btn.textContent = isMobile ? 'Send' : 'Generate QR';
    }
  }

  function showQR(id) {
    document.getElementById('send-card').classList.add('hidden');
    document.getElementById('qr-card').classList.remove('hidden');
    const wrap = document.getElementById('qr-wrap');
    wrap.innerHTML = '';
    new QRCode(wrap, { text: BASE_URL+'?code='+id, width:200, height:200, colorDark:'#000', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.M });
    document.getElementById('code-big').textContent = id.toUpperCase();
    let s = 90;
    const t = document.getElementById('timer');
    clearInterval(countdown);
    countdown = setInterval(()=>{
      s--;
      t.textContent = s > 0 ? `Expires in ${s}s` : 'Expired';
      t.className = s <= 20 ? 'timer warn' : 'timer';
      if (s <= 0) { clearInterval(countdown); resetSend(); }
    }, 1000);
    t.textContent = `Expires in ${s}s`;
  }

  function resetSend() {
    clearInterval(countdown);
    document.getElementById('qr-card').classList.add('hidden');
    document.getElementById('send-card').classList.remove('hidden');
    const btn = document.getElementById('send-btn');
    btn.disabled = false; btn.textContent = 'Generate QR';
    document.getElementById('send-text').value = '';
    setMsg('send-msg','','');
  }

  /* ── FETCH ── */
  async function fetchClip() {
    const btn = document.getElementById('fetch-btn');
    btn.disabled = true; btn.textContent = 'Fetching...';
    document.getElementById('fetch-result').classList.add('hidden');
    document.getElementById('copy-fetched-btn').classList.add('hidden');
    setMsg('fetch-msg','','');
    try {
      const { data, error } = await sb.from('clips')
        .select('content')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1)
        .single();
      if (error||!data) { setMsg('fetch-msg','Nothing waiting.','dim'); }
      else {
        fetchedText = data.content;
        const box = document.getElementById('fetch-result');
        box.textContent = fetchedText;
        box.classList.remove('hidden');
        document.getElementById('copy-fetched-btn').classList.remove('hidden');
      }
    } catch(e) { setMsg('fetch-msg','Network error.','err'); }
    btn.disabled = false; btn.textContent = 'Fetch Latest';
  }

  async function copyFetched() {
    await navigator.clipboard.writeText(fetchedText).catch(()=>{});
    const btn = document.getElementById('copy-fetched-btn');
    btn.textContent = 'Copied'; setTimeout(()=>btn.textContent='Copy', 2000);
  }

  /* ── PASTE ── */
  async function pasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('send-text').value = text;
    } catch(e) { document.getElementById('send-text').focus(); }
  }

  function setMsg(id, text, cls) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg'+(cls?' '+cls:'');
  }
</script>

<script>
  /* ── VERSION CHECK ──
     Change BUILD_VERSION whenever you push a new file.
     The page will auto-detect the mismatch and reload once. */
  const BUILD_VERSION = '1.2.0';
  const STORED = localStorage.getItem('qrb-version');
  if (STORED && STORED !== BUILD_VERSION) {
    localStorage.setItem('qrb-version', BUILD_VERSION);
    window.location.reload(true);
  } else {
    localStorage.setItem('qrb-version', BUILD_VERSION);
  }
</script>
</body>
</html>
