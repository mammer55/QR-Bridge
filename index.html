  localStorage.setItem('clip-version', BUILD_VERSION);

<style>
  :root {
    --accent:  #c2f6e5;
    --accent2: #a8e8d0;
    --bg:      #f3f2f1;
    --surface: #ffffff;
    --border:  #e1dfdd;
    --input:   #c8c6c4;
    --text:    #323130;
    --muted:   #605e5c;
    --dim:     #a19f9d;
    --err:     #d83b01;
    --codebg:  #f3f2f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px 48px;
    overflow-x: hidden; width: 100%; transition: background 0.2s, color 0.2s;
  }
  .container { width: 100%; max-width: 860px; overflow-x: hidden; }
  .header {
    background: var(--accent); border-radius: 4px 4px 0 0;
    padding: 10px 16px; display: flex; align-items: center;
  }
  .header-title { color: #1a1a1a; font-size: 13px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; }
  .header-ver { font-size: 10px; font-weight: 400; opacity: 0.45; }
  .theme-btn { font-size: 11px; color: rgba(0,0,0,0.45); cursor: pointer; padding: 3px 8px; border-radius: 2px; background: transparent; border: none; font-family: inherit; }
  .theme-btn:hover { background: rgba(0,0,0,0.08); }
  .cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 12px; align-items: stretch; }
  .cols > div { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .cols > div .card { flex: 1; }
  @media (max-width: 600px) {
    body { padding: 12px 8px 32px; }
    .cols { grid-template-columns: 1fr; }
    .cols > div { overflow: visible; }
    .header { border-radius: 4px; }
    .container { max-width: 100vw; }
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-top: none;
    padding: 16px; display: flex; flex-direction: column; min-height: 220px;
  }
  .section-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 100px; flex: 1;
    border: 1px solid var(--input); border-radius: 2px; padding: 8px 10px;
    font-family: inherit; font-size: 16px; color: var(--text); background: var(--surface);
    resize: none; outline: none; margin-bottom: 8px; line-height: 1.5; min-width: 0; max-width: 100%;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  textarea::placeholder { color: var(--dim); font-size: 14px; }
  .btn {
    display: block; width: 100%; padding: 7px 16px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    border-radius: 2px; cursor: pointer; border: none; text-align: center;
    transition: background 0.1s; margin-bottom: 6px;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn-primary { background: var(--accent); color: #1a1a1a; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { background: var(--input); cursor: not-allowed; color: var(--muted); }
  .btn-default { background: var(--surface); color: var(--text); border: 1px solid var(--input); }
  .btn-default:hover { background: var(--bg); }
  .result-box {
    background: var(--codebg); border: 1px solid var(--border); border-radius: 2px;
    padding: 10px; font-size: 13px; white-space: pre-wrap;
    overflow-wrap: break-word; word-break: break-word;
    max-height: 200px; overflow-y: auto; overflow-x: hidden;
    margin-bottom: 8px; line-height: 1.6; color: var(--text); width: 100%; max-width: 100%;
  }
  .poll-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; min-height: 20px; }
  .poll-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; transition: background 0.3s; }
  .poll-dot.live { background: #107c10; }
  .poll-dot.pulse { background: var(--accent2); animation: pulse 0.4s ease-out; }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.8)} 100%{transform:scale(1)} }
  .poll-label { font-size: 10px; color: var(--dim); letter-spacing: 0.04em; }
  .msg { font-size: 11px; min-height: 16px; margin-top: 4px; }
  .msg.err { color: var(--err); }
  .msg.ok  { color: #107c10; }
  .msg.dim { color: var(--dim); }
  .hidden { display: none !important; }
  .theme-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .theme-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .theme-panel-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .theme-close { cursor: pointer; font-size: 16px; color: var(--dim); }
  .theme-close:hover { color: var(--text); }
  .presets { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 16px; }
  .preset { border-radius: 4px; height: 42px; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.1s, border-color 0.1s; }
  .preset:hover { transform: scale(1.06); }
  .preset.active { border-color: var(--text); }
  .preset-top { flex: 1; }
  .preset-bot { height: 12px; }
  .preset-label { font-size: 9px; text-align: center; margin-top: 4px; color: var(--muted); }
  .custom-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .custom-field { flex: 1; }
  .custom-field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .custom-field input[type=color] { width: 100%; height: 32px; border: 1px solid var(--input); border-radius: 2px; cursor: pointer; padding: 2px; background: var(--surface); }
  .theme-actions { display: flex; gap: 8px; }
  .theme-actions .btn { margin-bottom: 0; }
  .pull-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .pull-header .section-label { margin-bottom: 0; }
  .auto-btn { font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer; border: 1px solid var(--input); background: var(--surface); color: var(--dim); font-family: inherit; font-weight: 600; letter-spacing: 0.04em; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .auto-btn.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent2); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-title">
      &#x1F4CB; Clip
      <span class="header-ver">v2.1.0</span>
    </div>
    <button class="theme-btn" onclick="openTheme()" title="Ctrl+Shift+T">Theme</button>
  </div>
  <div class="cols">
    <div>
      <div class="card">
        <div class="section-label">Push</div>
        <textarea id="push-text" placeholder="Paste anything here"></textarea>
        <button class="btn btn-default" onclick="pasteClipboard()">Paste from Clipboard</button>
        <button class="btn btn-primary" id="push-btn" onclick="pushClip()">Push</button>
        <div id="push-msg" class="msg"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="pull-header">
          <div class="section-label">Pull</div>
          <button id="auto-clip-btn" class="auto-btn" onclick="toggleAutoClip()" title="Auto-copy new clips to clipboard">Auto</button>
        </div>
        <div class="poll-row">
          <div class="poll-dot" id="poll-dot"></div>
          <span class="poll-label" id="poll-label">Connecting…</span>
        </div>
        <div id="pull-result" class="result-box hidden"></div>
        <button id="pull-copy-btn" class="btn btn-primary hidden" onclick="copyPulled()">Copy</button>
        <button id="pull-clear-btn" class="btn btn-default hidden" onclick="clearPull()">Clear</button>
        <button class="btn btn-default" id="fetch-btn" onclick="fetchLatest()">Fetch Latest</button>
        <div id="pull-msg" class="msg"></div>
      </div>
    </div>
  </div>
</div>

<div class="theme-overlay hidden" id="theme-overlay" onclick="if(event.target===this)closeTheme()">
  <div class="theme-panel">
    <div class="theme-panel-title">
      <span>Theme</span>
      <span class="theme-close" onclick="closeTheme()">&#x2715;</span>
    </div>
    <div class="presets" id="preset-list"></div>
    <div class="custom-row">
      <div class="custom-field"><label>Accent</label><input type="color" id="pick-accent" oninput="previewCustom()"></div>
      <div class="custom-field"><label>Background</label><input type="color" id="pick-bg" oninput="previewCustom()"></div>
      <div class="custom-field"><label>Surface</label><input type="color" id="pick-surface" oninput="previewCustom()"></div>
    </div>
    <div class="theme-actions">
      <button class="btn btn-primary" onclick="saveTheme()">Save</button>
      <button class="btn btn-default" onclick="closeTheme()">Cancel</button>
    </div>
  </div>
</div>

<script>
  const SUPA_URL  = 'https://owcukwsouruowulhohyq.supabase.co';
  const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Y3Vrd3NvdXJ1b3d1bGhvaHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5ODgzNzMsImV4cCI6MjA4NzU2NDM3M30.3njPBQGD1LEQc-h_j4VhAhngNzEH2p2gpqtRplqan_E';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_ANON);

  let pulledText = '';
  let lastSeenId = null;
  let realtimeConnected = false;
  let autoClipEnabled = localStorage.getItem('clip-auto') === '1';
  // Text we last wrote via auto-copy; if clipboard still matches, we "own" it
  let lastAutoCopied = null;

  window.addEventListener('load', () => {
    loadSavedTheme();
    updateAutoClipBtn();
    startRealtime();
    startFallbackPoll();
  });

  function toggleAutoClip() {
    autoClipEnabled = !autoClipEnabled;
    localStorage.setItem('clip-auto', autoClipEnabled ? '1' : '0');
    updateAutoClipBtn();
  }

  function updateAutoClipBtn() {
    const btn = document.getElementById('auto-clip-btn');
    btn.classList.toggle('active', autoClipEnabled);
    btn.title = autoClipEnabled ? 'Auto-copy ON — click to disable' : 'Auto-copy OFF — click to enable';
  }

  async function tryAutoCopy(text) {
    if (!autoClipEnabled) return;
    try {
      const current = await navigator.clipboard.readText();
      // Only write if we still own the clipboard (or it's our first auto-copy)
      if (lastAutoCopied === null || current === lastAutoCopied) {
        await navigator.clipboard.writeText(text);
        lastAutoCopied = text;
      }
      // User copied something else externally — back off; next new clip will try again
    } catch(_) {}
  }

  // --- Realtime (primary delivery) ---

  function startRealtime() {
    sb.channel('clips-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'clips' }, payload => {
        const row = payload.new;
        if (row && row.id !== lastSeenId && new Date(row.expires_at) > new Date()) {
          lastSeenId = row.id;
          pulledText = row.content;
          showPullResult(pulledText);
          flashDot();
          tryAutoCopy(pulledText);
        }
      })
      .subscribe(status => {
        realtimeConnected = status === 'SUBSCRIBED';
        const dot = document.getElementById('poll-dot');
        const lbl = document.getElementById('poll-label');
        if (realtimeConnected) {
          dot.className = 'poll-dot live';
          lbl.textContent = 'Live';
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          dot.className = 'poll-dot';
          lbl.textContent = 'Reconnecting…';
        }
      });
  }

  // Fallback poll catches gaps when realtime misses an event (e.g. tab was backgrounded)
  function startFallbackPoll() { setInterval(fallbackPoll, 15000); }

  async function fallbackPoll() {
    try {
      const { data } = await sb.from('clips')
        .select('id, content')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1).single();
      if (data && data.id !== lastSeenId) {
        lastSeenId = data.id;
        pulledText = data.content;
        showPullResult(pulledText);
        flashDot();
        tryAutoCopy(pulledText);
      }
    } catch(_) {}
    if (!realtimeConnected) {
      const dot = document.getElementById('poll-dot');
      if (!dot.className.includes('pulse')) dot.className = 'poll-dot live';
    }
  }

  function flashDot() {
    const dot = document.getElementById('poll-dot');
    dot.className = 'poll-dot pulse';
    setTimeout(() => { dot.className = 'poll-dot live'; }, 500);
  }

  // --- Push ---

  async function pushClip() {
    const text = document.getElementById('push-text').value.trim();
    const btn  = document.getElementById('push-btn');
    if (!text) { setMsg('push-msg', 'Nothing to push.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Pushing…';
    const expiresAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
    try {
      const { error } = await sb.from('clips').insert({ content: text, expires_at: expiresAt, source: 'pc' });
      if (error) throw error;
      setMsg('push-msg', 'Pushed.', 'ok');
      document.getElementById('push-text').value = '';
      setTimeout(() => setMsg('push-msg', '', ''), 3000);
    } catch(e) { setMsg('push-msg', e.message || 'Error.', 'err'); }
    btn.disabled = false; btn.textContent = 'Push';
  }

  async function pasteClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('push-text').value = text;
    } catch(_) {
      setMsg('push-msg', 'Clipboard blocked — paste manually (⌘V / Ctrl+V).', 'dim');
      document.getElementById('push-text').focus();
    }
  }

  // --- Pull ---

  async function fetchLatest() {
    const btn = document.getElementById('fetch-btn');
    btn.disabled = true; btn.textContent = 'Fetching…';
    try {
      const { data, error } = await sb.from('clips')
        .select('id, content')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1).single();
      if (error || !data) {
        setMsg('pull-msg', 'Nothing waiting.', 'dim');
      } else {
        lastSeenId = data.id;
        pulledText = data.content;
        showPullResult(pulledText);
        setMsg('pull-msg', '', '');
        tryAutoCopy(pulledText);
      }
    } catch(_) { setMsg('pull-msg', 'Network error.', 'err'); }
    btn.disabled = false; btn.textContent = 'Fetch Latest';
  }

  function showPullResult(text) {
    document.getElementById('pull-result').textContent = text;
    document.getElementById('pull-result').classList.remove('hidden');
    document.getElementById('pull-copy-btn').classList.remove('hidden');
    document.getElementById('pull-clear-btn').classList.remove('hidden');
  }

  async function copyPulled() {
    try {
      await navigator.clipboard.writeText(pulledText);
    } catch(_) {}
    const btn = document.getElementById('pull-copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  }

  function clearPull() {
    pulledText = '';
    document.getElementById('pull-result').classList.add('hidden');
    document.getElementById('pull-copy-btn').classList.add('hidden');
    document.getElementById('pull-clear-btn').classList.add('hidden');
    setMsg('pull-msg', '', '');
  }

  // --- Theme ---

  const PRESETS = [
    { name:'Mint',  accent:'#c2f6e5', accent2:'#a8e8d0', bg:'#f3f2f1', surface:'#ffffff', border:'#e1dfdd', input:'#c8c6c4', text:'#323130', muted:'#605e5c', dim:'#a19f9d', codebg:'#f3f2f1' },
    { name:'Dark',  accent:'#c2f6e5', accent2:'#a8e8d0', bg:'#1e1e1e', surface:'#2d2d2d', border:'#3d3d3d', input:'#555',    text:'#d4d4d4', muted:'#999',    dim:'#666',    codebg:'#252525' },
    { name:'Sky',   accent:'#bde0ff', accent2:'#9dcfff', bg:'#eef4fb', surface:'#ffffff', border:'#ccd9e8', input:'#b0c4d8', text:'#1a3a5c', muted:'#4a6a8c', dim:'#8aaccb', codebg:'#e8f0f8' },
    { name:'Peach', accent:'#ffd4b0', accent2:'#ffbf8e', bg:'#fdf5ef', surface:'#ffffff', border:'#e8d5c8', input:'#d4b8a8', text:'#3d2b1f', muted:'#7a5a4a', dim:'#b89080', codebg:'#f5ede6' },
    { name:'Mono',  accent:'#d0d0d0', accent2:'#b8b8b8', bg:'#f8f8f8', surface:'#ffffff', border:'#e0e0e0', input:'#c8c8c8', text:'#1a1a1a', muted:'#606060', dim:'#a0a0a0', codebg:'#f0f0f0' },
  ];

  function applyTheme(t) {
    const r = document.documentElement.style;
    ['accent','accent2','bg','surface','border','input','text','muted','dim'].forEach(k => r.setProperty('--'+k, t[k]));
    r.setProperty('--codebg', t.codebg);
  }

  function loadSavedTheme() {
    try { const s = localStorage.getItem('clip-theme'); if (s) applyTheme(JSON.parse(s)); } catch(_) {}
  }

  let pendingTheme = null;
  let themeAtOpen  = null;

  function buildPresets() {
    const active = localStorage.getItem('clip-theme-name') || 'Mint';
    document.getElementById('preset-list').innerHTML = PRESETS.map(p => {
      const cls = p.name === active ? 'preset active' : 'preset';
      return `<div><div class="${cls}" onclick="selectPreset('${p.name}')" style="background:${p.bg}">` +
        `<div class="preset-top" style="background:${p.surface};border-bottom:2px solid ${p.border}"></div>` +
        `<div class="preset-bot" style="background:${p.accent}"></div>` +
        `</div><div class="preset-label">${p.name}</div></div>`;
    }).join('');
  }

  function selectPreset(name) {
    const t = PRESETS.find(p => p.name === name);
    if (!t) return;
    pendingTheme = { ...t, _name: name };
    applyTheme(t);
    document.getElementById('pick-accent').value  = t.accent;
    document.getElementById('pick-bg').value      = t.bg;
    document.getElementById('pick-surface').value = t.surface;
    document.querySelectorAll('.preset').forEach((el, i) => el.classList.toggle('active', PRESETS[i].name === name));
  }

  function getLuminance(hex) {
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const lin = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
    return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  }

  function darken(hex, amt) {
    const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
    const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
    const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  function previewCustom() {
    const accent  = document.getElementById('pick-accent').value;
    const bg      = document.getElementById('pick-bg').value;
    const surface = document.getElementById('pick-surface').value;
    const lum = getLuminance(bg);
    pendingTheme = {
      ...(pendingTheme || PRESETS[0]),
      accent, accent2: darken(accent, 20), bg, surface, codebg: bg,
      text:   lum > 0.35 ? '#1a1a1a' : '#e8e8e8',
      muted:  lum > 0.35 ? '#605e5c' : '#9a9a9a',
      dim:    lum > 0.35 ? '#a19f9d' : '#606060',
      border: lum > 0.35 ? '#e1dfdd' : '#3d3d3d',
      input:  lum > 0.35 ? '#c8c6c4' : '#555555',
      _name: 'Custom',
    };
    applyTheme(pendingTheme);
    document.querySelectorAll('.preset').forEach(el => el.classList.remove('active'));
  }

  function openTheme() {
    buildPresets();
    const saved = JSON.parse(localStorage.getItem('clip-theme') || JSON.stringify(PRESETS[0]));
    themeAtOpen  = saved;
    pendingTheme = null;
    document.getElementById('pick-accent').value  = saved.accent  || '#c2f6e5';
    document.getElementById('pick-bg').value      = saved.bg      || '#f3f2f1';
    document.getElementById('pick-surface').value = saved.surface || '#ffffff';
    document.getElementById('theme-overlay').classList.remove('hidden');
  }

  function closeTheme() {
    document.getElementById('theme-overlay').classList.add('hidden');
    if (themeAtOpen) applyTheme(themeAtOpen);
  }

  function saveTheme() {
    if (!pendingTheme) { closeTheme(); return; }
    const { _name, ...td } = pendingTheme;
    localStorage.setItem('clip-theme', JSON.stringify(td));
    localStorage.setItem('clip-theme-name', _name || 'Custom');
    themeAtOpen = td;
    document.getElementById('theme-overlay').classList.add('hidden');
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key === 'T') { e.preventDefault(); openTheme(); }
    if (e.key === 'Escape') closeTheme();
  });

  function setMsg(id, text, cls) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg' + (cls ? ' ' + cls : '');
  }
</script>
</body>
</html>
